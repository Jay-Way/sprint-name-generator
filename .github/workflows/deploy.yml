name: Deploy

on:
  push:
    branches: [main]
    # The corpus, the app, the generator and the social card. A README edit
    # shouldn't spend an invalidation.
    paths:
      - index.html
      - 404.html
      - names.js
      - build.js
      - content.js
      - og.png
      - fonts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One deploy at a time, so two quick pushes can't invalidate over each other.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      BUCKET: ${{ vars.S3_BUCKET }}

    steps:
      # Full history: build.js dates the sitemap from the last commit that
      # touched a build input. A shallow clone has no such history, and the
      # sitemap would ship without <lastmod>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required repo variables
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$ROLE_ARN" || { echo "::error::Repo variable AWS_ROLE_ARN is not set. See README → Deployment."; exit 1; }
          test -n "$DISTRIBUTION_ID" || { echo "::error::Repo variable CLOUDFRONT_DISTRIBUTION_ID is not set. See README → Deployment."; exit 1; }
          test -n "$BUCKET" || { echo "::error::Repo variable S3_BUCKET is not set. See README → Deployment."; exit 1; }

      # Generates dist/ — the app, the corpus, and the crawlable register
      # built from it. Runs before the role is assumed: no credentials are in
      # the environment while third-party-free but still untrusted code runs.
      - name: Build the site
        run: node build.js

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: sprintname-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Explicit per-object cp rather than a sync: only s3:PutObject is needed,
      # nothing else in the working tree can be swept along by accident, and
      # each object carries the content type dist/manifest.json declares. The
      # charset is spelled out there because the corpus is full of ’, and
      # the register's key is extensionless, so S3 would otherwise guess.
      - name: Upload dist/
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key ctype cache; do
            echo "  $key  ($ctype)"
            aws s3 cp "dist/$key" "s3://$BUCKET/$key" \
              --content-type "$ctype" \
              --cache-control "$cache" \
              --no-progress
          done < <(jq -r '.[] | [.key, .contentType, .cacheControl] | @tsv' dist/manifest.json)

      # /* rather than the two paths: it counts as a single path against the
      # 1000/month free tier, and it also covers "/", which serves index.html
      # via the default root object and would otherwise stay cached.
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $id created for $DISTRIBUTION_ID" >> "$GITHUB_STEP_SUMMARY"
