name: Lint HTML

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
    htmlhint:
      name: Lint HTML
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 'lts/*'

        - name: Install HTMLHint
          run: npm install -g htmlhint

        - name: Run HTMLHint
          run: htmlhint "**/*.html"
