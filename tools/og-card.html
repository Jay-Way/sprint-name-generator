<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#E4E2D9;
  background-image:repeating-linear-gradient(to bottom, rgba(25,27,24,.045) 0 1px, transparent 1px 28px);
  font-family:"IBM Plex Sans",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:34px;
}
.sheet{
  width:100%;height:100%;
  background:#F6F5F0;
  border:1px solid #C2C0B4;
  box-shadow:0 1px 0 #DCDAD0;
  display:flex;flex-direction:column;
}
.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:30px 44px;border-bottom:2px solid #191B18;
}
.wordmark{
  font-family:"Archivo Black",sans-serif;
  font-size:34px;line-height:.94;letter-spacing:-.025em;color:#191B18;
}
.wordmark em{font-style:normal;color:#A61F2B}
.stamp-no{
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:#5E6159;text-align:right;line-height:1.9;
}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 44px}
.field-head{
  display:flex;align-items:baseline;justify-content:space-between;
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;padding-bottom:20px;
}
.field-label{color:#5E6159;font-weight:600}
.readout{color:#8B8D82}
.stage{border-top:1px solid #C2C0B4;border-bottom:1px solid #C2C0B4;padding:40px 0}
.name{
  font-family:"Archivo Black",sans-serif;
  font-size:96px;line-height:.93;letter-spacing:-.03em;color:#191B18;
}
.meta{
  display:flex;gap:26px;padding-top:20px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8B8D82;
}
.meta b{color:#5E6159;font-weight:500}
.meta .g{color:#A61F2B}
.fineprint{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 44px;border-top:1px solid #191B18;
  font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:#5E6159;
}
.fineprint .url{color:#A61F2B;font-weight:600;letter-spacing:.12em}
</style></head><body>
<div class="sheet">
  <div class="masthead">
    <div class="wordmark">Sprint<br>Designation <em>Office</em></div>
    <div class="stamp-no">Form SN&#8209;01<br>Issued under protest<br>Rev. 4 &#183; Supersedes all</div>
  </div>
  <div class="body">
    <div class="field-head"><span class="field-label">03 / Designation</span><span class="readout">Binding on all parties</span></div>
    <div class="stage"><div class="name">Refactor and Pray</div></div>
    <div class="meta">
      <span class="g">Enterprise Sarcasm</span>
      <span><b>17</b> chars</span>
      <span>Est <b>3</b></span>
      <span>Actual <b>21</b></span>
      <span>Approved by <b>nobody</b></span>
    </div>
  </div>
  <div class="fineprint">
    <span>385 funny sprint names &#183; eight genres</span>
    <span class="url">sprintname.dev</span>
  </div>
</div>
</body></html>
