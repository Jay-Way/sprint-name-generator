<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint Designation Office</title>
<!-- Seal of the office. Inline, so the site stays two files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23E4E2D9'/%3E%3Cg fill='%23A61F2B'%3E%3Crect x='11.6' y='2.6' width='8.8' height='4.8' rx='2.4'/%3E%3Crect x='13.8' y='6' width='4.4' height='5'/%3E%3Cpath d='M9.4 10.6h13.2l2.6 9H6.8Z'/%3E%3Crect x='4' y='21.6' width='24' height='4' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#E4E2D9;
  --sheet:#F6F5F0;
  --ink:#191B18;
  --ink-2:#5E6159;
  --ink-3:#8B8D82;
  --rule:#C2C0B4;
  --rule-soft:#DCDAD0;
  --accent-raw:#1F4E9C;
  --accent:var(--accent-raw);
  --on-accent:#F6F5F0;
  --grid:rgba(25,27,24,.045);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111310;
    --sheet:#1A1C17;
    --ink:#E9E7DC;
    --ink-2:#93958A;
    --ink-3:#6A6C62;
    --rule:#33362D;
    --rule-soft:#26291F;
    --accent:color-mix(in oklab, var(--accent-raw), #FFFFFF 42%);
    --on-accent:#111310;
    --grid:rgba(233,231,220,.05);
  }
}
:root[data-theme="dark"]{
  --paper:#111310;
  --sheet:#1A1C17;
  --ink:#E9E7DC;
  --ink-2:#93958A;
  --ink-3:#6A6C62;
  --rule:#33362D;
  --rule-soft:#26291F;
  --accent:color-mix(in oklab, var(--accent-raw), #FFFFFF 42%);
  --on-accent:#111310;
  --grid:rgba(233,231,220,.05);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  padding:clamp(16px,4vw,56px) clamp(14px,4vw,32px);
}

.sheet{
  width:100%;
  max-width:940px;
  background:var(--sheet);
  border:1px solid var(--rule);
  box-shadow:0 1px 0 var(--rule-soft), 0 18px 40px -32px rgba(0,0,0,.5);
  display:flex;
  flex-direction:column;
}

/* ---------- letterhead ---------- */
.masthead{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px 24px;
  padding:clamp(18px,3vw,26px) clamp(18px,3.5vw,34px);
  border-bottom:2px solid var(--ink);
}
.wordmark{
  margin:0;
  font-family:"Archivo Black","Arial Black",sans-serif;
  font-size:clamp(1.35rem,3.4vw,2.1rem);
  line-height:.94;
  letter-spacing:-.025em;
  text-wrap:balance;
}
.wordmark em{font-style:normal;color:var(--accent);transition:color .3s ease}
.stamp-no{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.66rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-2);
  text-align:right;
  line-height:1.7;
  font-variant-numeric:tabular-nums;
}

/* ---------- shared field chrome ---------- */
.field{padding:clamp(16px,3vw,24px) clamp(18px,3.5vw,34px)}
.field + .field{border-top:1px solid var(--rule-soft)}
.field-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.field-label,.readout{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.66rem;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.field-label{color:var(--ink-2);font-weight:600}
.readout{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- chips (genre + limit) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 13px 8px 10px;
  background:transparent;
  border:1px solid var(--rule);
  color:var(--ink-2);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.7rem;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background .18s ease;
}
.chip::before{
  content:"";
  width:9px;height:9px;
  border:1px solid currentColor;
  flex:none;
}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{
  color:var(--ink);
  border-color:var(--accent);
  background:color-mix(in oklab, var(--accent) 9%, transparent);
}
.chip[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}

/* ---------- the designation well ---------- */
.stage{
  position:relative;
  min-height:clamp(168px,25vh,236px);
  display:flex;
  align-items:center;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  padding:clamp(18px,3vw,28px) 0;
}
.name{
  margin:0;
  font-family:"Archivo Black","Arial Black",sans-serif;
  font-size:clamp(2.1rem,7.2vw,4.9rem);
  line-height:.93;
  letter-spacing:-.03em;
  text-wrap:balance;
  overflow-wrap:break-word;
}
.name.is-long{font-size:clamp(1.8rem,5.4vw,3.7rem)}
.name.is-xlong{font-size:clamp(1.55rem,4.3vw,3rem)}
.name.is-xxlong{font-size:clamp(1.35rem,3.6vw,2.5rem)}
.name.is-idle{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.78rem;
  font-weight:400;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.name.is-stamped{animation:stamp .34s cubic-bezier(.16,1.2,.3,1) both}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.14) translateY(-3px);filter:blur(3px)}
  55%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}

/* committee log overlays the well */
.committee{
  position:absolute;
  inset:clamp(18px,3vw,28px) 0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.76rem;
  letter-spacing:.04em;
  color:var(--ink-2);
}
.committee[hidden]{display:none}
.cline{
  display:flex;gap:10px;align-items:baseline;
  animation:logline .2s ease both;
}
.cline span{color:var(--accent);font-weight:600}
.cline:not(:last-child){opacity:.42}
@keyframes logline{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

/* metadata row */
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px 18px;
  margin-top:14px;
  min-height:1.2em;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.66rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.meta b{color:var(--ink-2);font-weight:500}
.meta .m-genre{color:var(--accent)}
.meta .m-over b{color:var(--accent)}

/* ---------- actions ---------- */
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:0 clamp(18px,3.5vw,34px) clamp(18px,3vw,26px);
}
.btn{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:16px 26px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--sheet);
  cursor:pointer;
  flex:1 1 260px;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:progress}
.btn--ghost{
  flex:0 0 auto;
  background:transparent;
  color:var(--ink-2);
  border-color:var(--rule);
}
.btn--ghost:hover:not(:disabled){background:transparent;color:var(--ink);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- fine print ---------- */
.fineprint{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  align-items:center;
  justify-content:space-between;
  padding:14px clamp(18px,3.5vw,34px);
  border-top:1px solid var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.62rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.linkbtn{
  background:none;border:0;padding:0;
  font:inherit;letter-spacing:inherit;text-transform:inherit;
  color:var(--ink-3);cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;
}
.linkbtn:hover{color:var(--ink)}
.ghlink{
  display:inline-flex;
  align-items:center;
  color:var(--ink-3);
  transition:color .2s ease;
}
.ghlink:hover{color:var(--ink)}
.ghlink svg{display:block;width:14px;height:14px}

@media (prefers-reduced-motion:reduce){
  .name.is-stamped,.cline{animation:none}
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="sheet">

  <header class="masthead">
    <h1 class="wordmark">Sprint<br>Designation <em>Office</em></h1>
    <div class="stamp-no">
      Form SN&#8209;01<br>
      Issued under protest<br>
      Rev. 4 &#183; Supersedes all
    </div>
  </header>

  <section class="field">
    <div class="field-head">
      <span class="field-label">01 / Genre</span>
      <span class="readout" id="genre-readout">&nbsp;</span>
    </div>
    <div class="chips" id="genre-chips" role="group" aria-label="Genre"></div>
  </section>

  <section class="field">
    <div class="field-head">
      <span class="field-label">02 / Character limit</span>
      <span class="readout" id="limit-readout">&nbsp;</span>
    </div>
    <div class="chips" id="limit-chips" role="group" aria-label="Character limit"></div>
  </section>

  <section class="field">
    <div class="field-head">
      <span class="field-label">03 / Designation</span>
      <span class="readout">Binding on all parties</span>
    </div>
    <div class="stage">
      <p class="name is-idle" id="name" aria-live="polite">No designation issued</p>
      <div class="committee" id="committee" hidden aria-hidden="true"></div>
    </div>
    <div class="meta" id="meta"></div>
  </section>

  <div class="actions">
    <button class="btn" id="convene">Convene committee</button>
    <button class="btn btn--ghost" id="copy" disabled>Copy</button>
  </div>

  <footer class="fineprint">
    <span id="corpus">&nbsp;</span>
    <span>Minutes stored in this browser only. Nothing is transmitted.</span>
    <button class="linkbtn" id="reset">Shred the minutes</button>
    <a class="ghlink" href="https://github.com/Jay-Way/sprint-name-generator"
       target="_blank" rel="noopener noreferrer"
       aria-label="Source on GitHub" title="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.995 7.995 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
  </footer>

</main>

<script src="names.js"></script>
<script>
/* Character limits. Jira caps sprint names; 26 is what this office
   has been burned by, 30 is the other figure people report. Ordered
   loosest first so "raise the limit" walks backwards through it. */
const LIMITS = [
  { id:"none", label:"No limit",   max: Infinity },
  { id:"40",   label:"≤ 40",  max: 40 },
  { id:"30",   label:"≤ 30",  max: 30 },
  { id:"26",   label:"≤ 26 Jira", max: 26 }
];

const PROCEDURE = [
  "Convening committee",
  "Consulting stakeholders",
  "Aligning with quarterly objectives",
  "Checking for naming conflicts",
  "Escalating to steering committee",
  "Cross-referencing brand guidelines",
  "Awaiting sign-off from Klaus",
  "Redacting the first proposal",
  "Minuting one objection",
  "Deferring the objection to next quarter"
];

const SIGNATORIES = ["nobody","Klaus","the committee","a majority of one","absentia","retroactively","no one present"];
const ESCALATION = ["Convene committee","Convene again","Reconvene","Once more","Escalate","Escalate further","This is fine","Ship something"];

const SEEN_KEY = "sng.seen.v1";
const LIMIT_KEY = "sng.limit.v1";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const el = {
  genreChips: document.getElementById("genre-chips"),
  limitChips: document.getElementById("limit-chips"),
  genreReadout: document.getElementById("genre-readout"),
  limitReadout: document.getElementById("limit-readout"),
  name: document.getElementById("name"),
  committee: document.getElementById("committee"),
  meta: document.getElementById("meta"),
  convene: document.getElementById("convene"),
  copy: document.getElementById("copy"),
  reset: document.getElementById("reset"),
  corpus: document.getElementById("corpus")
};

let genre = GENRES[0];
let limitIdx = 0;
let current = null;
let presses = 0;
let busy = false;

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const limit = () => LIMITS[limitIdx];

function store(){
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; }
}
function save(all){
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch (e) {}
}
function used(){ return store()[genre.id] || []; }
function markSeen(name){
  const all = store();
  const list = all[genre.id] || [];
  if (!list.includes(name)) list.push(name);
  all[genre.id] = list;
  save(all);
}

/* Names in this genre that fit the current character limit. */
function eligible(){ return genre.names.filter(n => n.length <= limit().max); }
/* ...of those, the ones not yet issued. */
function remaining(){ const u = used(); return eligible().filter(n => !u.includes(n)); }
/* Unissued names that exist but are too long to be offered. */
function blocked(){
  const u = used();
  return genre.names.filter(n => n.length > limit().max && !u.includes(n)).length;
}

/* Three states, three things the main button can usefully do. */
function mode(){
  if (remaining().length) return "ready";
  if (blocked()) return "raise";
  return "reopen";
}

function buildChips(){
  GENRES.forEach(g => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = g.label;
    b.addEventListener("click", () => { genre = g; presses = 0; refresh(); });
    el.genreChips.appendChild(b);
  });
  LIMITS.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = l.label;
    b.addEventListener("click", () => { limitIdx = i; saveLimit(); refresh(); });
    el.limitChips.appendChild(b);
  });
  const total = GENRES.reduce((n, g) => n + g.names.length, 0);
  el.corpus.textContent = total + " designations on file";
}

function saveLimit(){
  try { localStorage.setItem(LIMIT_KEY, limit().id); } catch (e) {}
}
function loadLimit(){
  let id = null;
  try { id = localStorage.getItem(LIMIT_KEY); } catch (e) {}
  const i = LIMITS.findIndex(l => l.id === id);
  if (i > -1) limitIdx = i;
}

/* Single place that re-syncs chrome to state. */
function refresh(){
  document.documentElement.style.setProperty("--accent-raw", genre.accent);
  Array.from(el.genreChips.children).forEach((c, i) =>
    c.setAttribute("aria-pressed", String(GENRES[i] === genre)));
  Array.from(el.limitChips.children).forEach((c, i) =>
    c.setAttribute("aria-pressed", String(i === limitIdx)));

  const fits = eligible();
  const issued = used().filter(n => n.length <= limit().max).length;
  el.genreReadout.textContent =
    String(issued).padStart(2,"0") + " / " + String(fits.length).padStart(2,"0") + " issued";
  el.limitReadout.textContent = fits.length + " of " + genre.names.length + " eligible";

  const m = mode();
  el.convene.textContent =
    m === "ready"  ? ESCALATION[Math.min(presses, ESCALATION.length - 1)] :
    m === "raise"  ? "Raise the limit" :
                     "Reopen the register";
}

function showName(text, stamped){
  el.name.className = "name";
  const n = text.length;
  if (n > 40) el.name.classList.add("is-xxlong");
  else if (n > 34) el.name.classList.add("is-xlong");
  else if (n > 20) el.name.classList.add("is-long");
  if (stamped && !reduced) el.name.classList.add("is-stamped");
  el.name.textContent = text;
}

function showMeta(name){
  const est = 1 + Math.floor(Math.random() * 5);
  const act = est * (3 + Math.floor(Math.random() * 6));
  el.meta.innerHTML =
    '<span class="m-genre">' + genre.label + '</span>' +
    '<span><b>' + name.length + '</b> chars</span>' +
    '<span>Est <b>' + est + '</b></span>' +
    '<span>Actual <b>' + act + '</b></span>' +
    '<span>Approved by <b>' + pick(SIGNATORIES) + '</b></span>';
}

async function runCommittee(){
  el.meta.innerHTML = "";
  el.name.style.visibility = "hidden";
  el.committee.hidden = false;
  el.committee.innerHTML = "";

  const steps = PROCEDURE.slice().sort(() => Math.random() - .5).slice(0, 4);
  steps.push("Approved without discussion");

  const gap = reduced ? 70 : 185;
  for (let i = 0; i < steps.length; i++){
    const row = document.createElement("div");
    row.className = "cline";
    row.innerHTML = '<span>' + String(i + 1).padStart(2,"0") + '</span>' +
                    steps[i] + (i < steps.length - 1 ? "&hellip;" : ".");
    el.committee.appendChild(row);
    await wait(gap);
  }
  await wait(reduced ? 60 : 150);
  el.committee.hidden = true;
  el.name.style.visibility = "";
}

async function convene(){
  if (busy) return;

  if (mode() === "reopen"){
    const spent = genre.label;
    const all = store();
    delete all[genre.id];
    save(all);
    presses = 0;
    current = null;
    el.copy.disabled = true;
    showName("You have exhausted " + spent + ". So has your team.", false);
    el.meta.innerHTML = '<span class="m-genre">Register reopened</span>' +
                        '<span>The committee remembers <b>nothing</b></span>';
    refresh();
    return;
  }

  /* Nothing short enough left, but longer names are still unissued —
     step the limit out until something is available, then proceed. */
  if (mode() === "raise"){
    while (limitIdx > 0 && !remaining().length) limitIdx--;
    saveLimit();
    refresh();
  }

  busy = true;
  el.convene.disabled = true;
  el.copy.disabled = true;

  await runCommittee();

  const name = pick(remaining());
  current = name;
  markSeen(name);
  showName(name, true);
  showMeta(name);
  history.replaceState(null, "", "#/" + genre.id + "/" + slug(name));

  presses++;
  el.copy.disabled = false;
  el.copy.textContent = "Copy";
  el.convene.disabled = false;
  busy = false;
  refresh();

  if (mode() === "reopen"){
    el.meta.insertAdjacentHTML("beforeend", '<span><b>Register exhausted</b></span>');
  } else if (mode() === "raise"){
    el.meta.insertAdjacentHTML("beforeend",
      '<span class="m-over"><b>' + blocked() + '</b> left, all too long</span>');
  }
}

function fromHash(){
  const m = location.hash.match(/^#\/([a-z0-9-]+)\/([a-z0-9-]+)$/);
  if (!m) return false;
  const g = GENRES.find(x => x.id === m[1]);
  if (!g) return false;
  const n = g.names.find(x => slug(x) === m[2]);
  if (!n) return false;
  genre = g;
  markSeen(n);
  current = n;
  showName(n, false);
  showMeta(n);
  el.copy.disabled = false;
  refresh();
  return true;
}

el.convene.addEventListener("click", convene);

el.copy.addEventListener("click", async () => {
  if (!current) return;
  try {
    await navigator.clipboard.writeText(current);
    el.copy.textContent = "Copied";
  } catch (e) {
    el.copy.textContent = "Copy failed";
  }
  setTimeout(() => { el.copy.textContent = "Copy"; }, 1400);
});

el.reset.addEventListener("click", () => {
  try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  presses = 0;
  refresh();
});

buildChips();
loadLimit();
if (!fromHash()) refresh();
</script>
</body>
</html>
