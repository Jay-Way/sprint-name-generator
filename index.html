  /* V. There is only one member left. */
  "No one left to convene",
  "Convene yourself",
  "You are the quorum",
  "You are the committee",
  "The committee is you",
  "Proceed as sole authority",   
  /* VI. Only despair left. */
  "Consult the forbidden archive",
  "Accept reality",
  "Ignore the anomaly",
  "Procedure exhausted",
  "Further escalation unavailable",
  "This incident will be reported",
  "The Office recommends acceptance",
];

const SEEN_KEY = "sng.seen.v1";
const LIMIT_KEY = "sng.limit.v1";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- office hours ----------
   The Office is staffed 09:00-17:00 on weekdays. The site is not: it answers
   at any hour, out of a building nobody is in. Read from the visitor's own
   clock rather than the server's, so a copy of this page cached for five
   minutes still tells the truth about the time. */
const OFFICE_OPENS = 9;
const OFFICE_SHUTS = 17;

function officeShift(){
  const now = new Date();
  const day = now.getDay();
  if (day === 0 || day === 6) return "weekend";
  const h = now.getHours();
  return (h < OFFICE_OPENS || h >= OFFICE_SHUTS) ? "night" : null;
}

const el = {
  genreChips: document.getElementById("genre-chips"),
  limitChips: document.getElementById("limit-chips"),
  genreReadout: document.getElementById("genre-readout"),
  limitReadout: document.getElementById("limit-readout"),
  name: document.getElementById("name"),
  committee: document.getElementById("committee"),
  meta: document.getElementById("meta"),
  convene: document.getElementById("convene"),
  copy: document.getElementById("copy"),
  reset: document.getElementById("reset"),
  designationReadout: document.getElementById("designation-readout"),
  corpus: document.getElementById("corpus"),
  stamp: document.getElementById("stamp")
};

let genre = GENRES[0];
let limitIdx = 0;
let current = null;
let presses = 0;
let busy = false;

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const pick = a => a[Math.floor(Math.random() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const limit = () => LIMITS[limitIdx];

function store(){
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; }
}
function save(all){
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch (e) {}
}
function used(){ return store()[genre.id] || []; }
function markSeen(name){
  const all = store();
  const list = all[genre.id] || [];
  if (!list.includes(name)) list.push(name);
  all[genre.id] = list;
  save(all);
}

/* Names in this genre that fit the current character limit. */
function eligible(){ return genre.names.filter(n => n.length <= limit().max); }
/* ...of those, the ones not yet issued. */
function remaining(){ const u = used(); return eligible().filter(n => !u.includes(n)); }
/* Unissued names that exist but are too long to be offered. */
function blocked(){
  const u = used();
  return genre.names.filter(n => n.length > limit().max && !u.includes(n)).length;
}

/* Three states, three things the main button can usefully do. */
function mode(){
  if (remaining().length) return "ready";
  if (blocked()) return "raise";
  return "reopen";
}

/* Attach a handler to each chip, creating it only if it isn't there already.
   build.js writes the chips into the shipped HTML, so on the deployed site
   this only wires them up and the page never reflows - building them here was
   worth 0.30 of cumulative layout shift, because two rows of chips appearing
   after the script ran pushed every section below them down. Opened straight
   from disk there is no build, so the elements still get created. */
function wireChips(host, labels, onPick){
  labels.forEach((label, i) => {
    let b = host.children[i];
    if (!b){
      b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = label;
      host.appendChild(b);
    }
    b.addEventListener("click", () => onPick(i));
  });
}

function buildChips(){
  wireChips(el.genreChips, GENRES.map(g => g.label),
    i => { genre = GENRES[i]; refresh(); });
  wireChips(el.limitChips, LIMITS.map(l => l.label),
    i => { limitIdx = i; saveLimit(); refresh(); });
  const total = GENRES.reduce((n, g) => n + g.names.length, 0);
  el.corpus.textContent = total;
}

function saveLimit(){
  try { localStorage.setItem(LIMIT_KEY, limit().id); } catch (e) {}
}
function loadLimit(){
  let id = null;
  try { id = localStorage.getItem(LIMIT_KEY); } catch (e) {}
  const i = LIMITS.findIndex(l => l.id === id);
  if (i > -1) limitIdx = i;
}

/* Single place that re-syncs chrome to state. */
function refresh(){
  document.documentElement.style.setProperty("--accent-raw", genre.accent);
  Array.from(el.genreChips.children).forEach((c, i) =>
    c.setAttribute("aria-pressed", String(GENRES[i] === genre)));
  Array.from(el.limitChips.children).forEach((c, i) =>
    c.setAttribute("aria-pressed", String(i === limitIdx)));

  const fits = eligible();
  const issued = used().filter(n => n.length <= limit().max).length;
  el.genreReadout.textContent =
    String(issued).padStart(2,"0") + " / " + String(fits.length).padStart(2,"0") + " issued";
  el.limitReadout.textContent = fits.length + " of " + genre.names.length + " eligible";

  const m = mode();
  el.convene.textContent =
    m === "ready"  ? ESCALATION[Math.min(presses, ESCALATION.length - 1)] :
    m === "raise"  ? "Raise the limit" :
                     "Reopen the register";
  /* Restores the default; the exhaustion notice overrides it below. The
     meta row already warns "Register exhausted" once the last name is out,
     so reporting it here as well would print the same words twice. */
  el.designationReadout.textContent = "Binding on all parties";
}

function showName(text, stamped){
  el.name.className = "name";
  /* Dropping and re-adding is-stamped in one task does not replay the
     animation: the engine only recalculates style once, at the end, and
     never sees the animation go away. Reading a layout property forces
     that recalculation in between, so every roll gets a fresh stamp. */
  void el.name.offsetWidth;
  const n = text.length;
  if (n > 40) el.name.classList.add("is-xxlong");
  else if (n > 34) el.name.classList.add("is-xlong");
  else if (n > 20) el.name.classList.add("is-long");
  if (stamped && !reduced) el.name.classList.add("is-stamped");
  el.name.textContent = text;
}

function showMeta(name){
  const est = 1 + Math.floor(Math.random() * 5);
  const act = est * (3 + Math.floor(Math.random() * 6));
  el.meta.innerHTML =
    '<span class="m-genre">' + genre.label + '</span>' +
    '<span><b>' + name.length + '</b> chars</span>' +
    '<span>Est <b>' + est + '</b></span>' +
    '<span>Actual <b>' + act + '</b></span>' +
    '<span>Approved by <b>' + pick(SIGNATORIES) + '</b></span>';
}

async function runCommittee(){
  el.meta.innerHTML = "";
  el.name.style.visibility = "hidden";
  el.committee.hidden = false;
  el.committee.innerHTML = "";

  const steps = PROCEDURE.slice().sort(() => Math.random() - .5).slice(0, 4);
  steps.push("Approved without discussion");
  /* After hours the log gains one line before the sign-off it is somehow
     still getting. Nobody is here to convene; the procedure runs anyway. */
  if (officeShift()) steps.splice(steps.length - 1, 0, "Waiting for someone to return");

  const gap = reduced ? 70 : 185;
  for (let i = 0; i < steps.length; i++){
    const row = document.createElement("div");
    row.className = "cline";
    row.innerHTML = '<span>' + String(i + 1).padStart(2,"0") + '</span>' +
                    steps[i] + (i < steps.length - 1 ? "&hellip;" : ".");
    el.committee.appendChild(row);
    await wait(gap);
  }
  await wait(reduced ? 60 : 150);
  el.committee.hidden = true;
  el.name.style.visibility = "";
}

async function convene(){
  if (busy) return;

  if (mode() === "reopen"){
    const all = store();
    delete all[genre.id];
    save(all);
    presses = 0;
    current = null;
    el.copy.disabled = true;
    showName(genre.exhausted, false);
    el.name.classList.add("is-notice");
    el.meta.innerHTML = '<span class="m-genre">Register reopened</span>' +
                        '<span>The committee remembers <b>nothing</b></span>';
    refresh();
    /* After refresh(), which has already seen the register emptied and would
       otherwise report business as usual. The field head names the condition,
       the notice comments on it, the meta line reports what was done. */
    el.designationReadout.textContent = "Register exhausted";
    return;
  }

  /* Nothing short enough left, but longer names are still unissued -
     step the limit out until something is available, then proceed. */
  if (mode() === "raise"){
    while (limitIdx > 0 && !remaining().length) limitIdx--;
    saveLimit();
    refresh();
  }

  busy = true;
  el.convene.disabled = true;
  el.copy.disabled = true;

  await runCommittee();

  const name = pick(remaining());
  current = name;
  markSeen(name);
  showName(name, true);
  showMeta(name);
  history.replaceState(null, "", "#/" + genre.id + "/" + slug(name));

  presses++;
  el.copy.disabled = false;
  el.copy.textContent = "Copy";
  el.convene.disabled = false;
  busy = false;
  refresh();

  if (mode() === "reopen"){
    el.meta.insertAdjacentHTML("beforeend", '<span><b>Register exhausted</b></span>');
  } else if (mode() === "raise"){
    el.meta.insertAdjacentHTML("beforeend",
      '<span class="m-over"><b>' + blocked() + '</b> left, all too long</span>');
  }
}

function fromHash(){
  const m = location.hash.match(/^#\/([a-z0-9-]+)\/([a-z0-9-]+)$/);
  if (!m) return false;
  const g = GENRES.find(x => x.id === m[1]);
  if (!g) return false;
  const n = g.names.find(x => slug(x) === m[2]);
  if (!n) return false;
  genre = g;
  markSeen(n);
  current = n;
  showName(n, false);
  showMeta(n);
  el.copy.disabled = false;
  refresh();
  return true;
}

el.convene.addEventListener("click", convene);

el.copy.addEventListener("click", async () => {
  if (!current) return;
  try {
    await navigator.clipboard.writeText(current);
    el.copy.textContent = "Copied";
  } catch (e) {
    el.copy.textContent = "Copy failed";
  }
  setTimeout(() => { el.copy.textContent = "Copy"; }, 1400);
});

el.reset.addEventListener("click", () => {
  try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  presses = 0;
  refresh();
});


/* The letterhead is the only part of the form that admits what time it is. */
const outside = officeShift();
if (outside) {
  el.stamp.insertAdjacentHTML("beforeend",
    '<br><span class="unstaffed">' +
    (outside === "weekend" ? "Closed until Monday" : "Currently unstaffed") +
    "</span>");
}

buildChips();
loadLimit();
if (!fromHash()) refresh();

</script>
</body>
</html>
